# MPD — configuración para streamer HiFi bit-perfect
# Los marcadores @...@ los sustituye install.sh

music_directory         "/var/lib/mpd/music"
playlist_directory      "/var/lib/mpd/playlists"
db_file                 "/var/lib/mpd/tag_cache"
state_file              "/var/lib/mpd/state"
sticker_file            "/var/lib/mpd/sticker.sql"

user                    "mpd"
bind_to_address         "0.0.0.0"
port                    "6600"

# Detectar automáticamente música nueva añadida a music_directory
auto_update             "yes"

# Salida directa al hardware: sin dmix, sin PulseAudio, sin remuestreo.
# El volumen se controla en el amplificador (mixer_type "none").
# Si necesitas volumen desde el móvil, cambia a mixer_type "software".
audio_output {
    type            "alsa"
    name            "@DEVICE_NAME@ DAC"
    device          "@ALSA_DEVICE@"
    mixer_type      "none"
    auto_resample   "no"
    auto_channels   "no"
    auto_format     "no"
    dop             "no"    # pon "yes" si tu DAC acepta DSD por DoP
}

# Calidad del remuestreador SOLO si algún día activas resampling explícito
samplerate_converter    "soxr very high"

filesystem_charset      "UTF-8"
