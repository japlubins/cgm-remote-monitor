// shairport-sync — receptor AirPlay
// Los marcadores @...@ los sustituye install.sh

general =
{
        name = "@DEVICE_NAME@";
        // Volumen por software dentro de shairport (el ampli manda en el volumen final)
        output_backend = "alsa";
};

alsa =
{
        output_device = "@ALSA_DEVICE@";
        // Sin mezclador hardware: shairport ajusta volumen en software
        // (AirPlay siempre envía 44100/16, no hay pérdida adicional relevante)
};

sessioncontrol =
{
        // Si alguien conecta por AirPlay, corta la sesión anterior a los 120 s de inactividad
        session_timeout = 120;
};
