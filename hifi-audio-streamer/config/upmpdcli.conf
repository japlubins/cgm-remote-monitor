# upmpdcli — renderizador UPnP/DLNA que reproduce a través de MPD
# Los marcadores @...@ los sustituye install.sh

friendlyname = @DEVICE_NAME@
mpdhost = localhost
mpdport = 6600

# upmpdcli no toca el volumen de MPD (que va en mixer_type none);
# usa su propio control interno para los control points que lo pidan
ownqueue = 1
